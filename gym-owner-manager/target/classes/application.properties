server.port=8080
spring.application.name=gym-owner-manager

# ---- Database: H2 file DB (works instantly in IntelliJ). Data is kept in ./data ----
spring.datasource.url=jdbc:h2:file:./data/gymdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: comment the H2 lines above and uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/gymdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Owner account (used only the first time the database is created) ----
app.owner.username=admin
app.owner.password=admin123
app.owner.name=Gym Owner
# OTPs for billing-number changes are sent to this number
app.owner.phone=9999999999

# ---- OTP ----
# dev-mode=true prints the OTP in the console and shows it on screen. Set false once a real SMS gateway is wired in.
app.otp.dev-mode=true
app.otp.validity-minutes=5

app.data-dir=./data
